name: Backend deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-4
  AWS_ROLE_TO_ASSUME: arn:aws:iam::057654277689:role/fit5120-backend-github-actions
  ECR_REGISTRY: 057654277689.dkr.ecr.ap-southeast-4.amazonaws.com
  ECR_REPOSITORY: fit5120/backend
  ECS_CLUSTER: fit5120-backend-demo
  ECS_SERVICE: fit5120-backend
  ECS_TASK_DEFINITION: fit5120-backend
  CONTAINER_NAME: backend
  API_BASE_URL: https://dpevp4238kw5k.cloudfront.net

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    name: Build, push, and deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Read current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render new task definition
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          container_count=$(jq --arg container "$CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $container)] | length' \
            task-definition.json)
          test "$container_count" -eq 1

          jq --arg image "$IMAGE_URI" --arg container "$CONTAINER_NAME" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .tags
            )
            | (.containerDefinitions[] | select(.name == $container) | .image) = $image
            | (.containerDefinitions[] | select(.name == $container) | .environment) |=
                ((. // [])
                  | map(select(.name != "DATA_SOURCE"))
                  + [{"name": "DATA_SOURCE", "value": "rds"}])
          ' task-definition.json > task-definition-rendered.json

      - name: Register new ECS task definition
        id: register-task-definition
        run: |
          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          test -n "$task_definition_arn"
          echo "task_definition_arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task-definition.outputs.task_definition_arn }}" \
            --region "$AWS_REGION"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Smoke test public backend
        run: |
          health_status=$(curl -sS \
            -o health.json \
            -w "%{http_code}" \
            "$API_BASE_URL/health")
          test "$health_status" = "200"
          jq -e '.status == "ok"' health.json

          headers=$(mktemp)
          cors_status=$(curl -sS \
            -D "$headers" \
            -o /dev/null \
            -w "%{http_code}" \
            -H "Origin: https://calmpath-tp10.netlify.app" \
            "$API_BASE_URL/health")
          test "$cors_status" = "200"
          grep -i "^access-control-allow-origin: https://calmpath-tp10.netlify.app" "$headers"
